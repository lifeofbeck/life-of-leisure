<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Life of Leisure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Shrikhand&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF4E8;--card:#FFFBF4;--paper:#F4E8D3;--ink:#3A2A1E;--muted:#8A6A4A;--line:#E6D7BD;
  --cherry:#C8322F;--pink:#D9486F;--tang:#E8742C;--butter:#D9A520;--teal:#1F8A8A;--navy:#3B5B9A;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --script:'Italianno','Brush Script MT',cursive;
  --display:'Shrikhand','Playfair Display',Georgia,serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;pointer-events:none;height:calc(env(safe-area-inset-top,0px) + 30px);background:#DCEBE7;box-shadow:0 1px 0 rgba(21,95,95,.12)}
.topbar .awning{margin-inline:0}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;background:#F6EFE3 repeating-linear-gradient(90deg,#CFE3DF 0 22px,#F6EFE3 22px 44px)}
body{background:transparent}
body{color:var(--ink);font-family:var(--serif);font-size:16px;text-transform:lowercase;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 36px) calc(110px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;text-transform:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:4px}
.awning{height:16px;margin-inline:-16px;background:repeating-linear-gradient(90deg,var(--cherry) 0 16px,var(--cream) 16px 32px);border-bottom:2px solid var(--cherry)}
.caps{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:500}
header.top{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:14px;text-align:center}
.wordmark{font-family:var(--display);font-size:40px;line-height:1.05;color:#F2A7BA;text-shadow:2px 2px 0 var(--cherry),-1px -1px 0 var(--cherry),1px -1px 0 var(--cherry),-1px 1px 0 var(--cherry);letter-spacing:.01em;transform:rotate(-3deg);margin:6px 0 4px}
header.top .caps,.weeknav .caps{color:#3A2A1E}
.tagline{font-family:var(--script);font-size:30px;line-height:1;color:#155F5F}
.chip-q{display:inline-flex;gap:8px;align-items:center;margin-top:8px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:0 2px 8px rgba(20,70,70,.10)}
.card{background:var(--card);border:1px solid rgba(230,215,189,.7);border-radius:8px;position:relative;box-shadow:0 1px 2px rgba(20,70,70,.08),0 8px 22px rgba(20,70,70,.13)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.card-t{font-family:var(--script);font-size:38px;line-height:.95}
.card-c{font-variant-numeric:tabular-nums}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 12px 16px}
.daybar .greet{font-family:var(--script);font-size:38px;color:var(--pink);line-height:1.1}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.navbtn[disabled]{opacity:.3;cursor:default}
.today-link{font-size:12px;color:var(--cherry);text-decoration:underline;text-underline-offset:3px}
.postmark{position:absolute;right:-6px;top:-30px;transform:rotate(-12deg);pointer-events:none;animation:thump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes thump{0%{transform:rotate(-12deg) scale(1.7);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:7px 16px;border-top:1px dashed var(--line);text-align:left;min-height:48px}
.box{width:30px;height:30px;flex-shrink:0;border:1.5px dashed #CDB894;border-radius:3px;display:grid;place-items:center}
.row.on .box{border-color:transparent}
.lbl{font-size:15.5px;line-height:1.3}
.row.on .lbl{color:var(--muted)}
.sub{font-size:12px;color:var(--muted);font-style:italic}
.pop svg{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1.9) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(var(--r,0deg));opacity:1}}
.group{padding:10px 16px 14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:center;gap:10px}
.group-h .lbl{font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--cream);font-size:14px;min-height:36px}
.chip.on{color:#FFFBF4;border-color:transparent}
.chip.fun{font-style:italic}
.key{display:flex;flex-direction:column;gap:2px;line-height:1.45}
.key b{font-weight:500;font-style:normal}
.fun-lbl{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
.quote{text-align:center;font-family:var(--script);font-size:30px;line-height:1.1;color:var(--pink);padding:4px 0}
.gazette{background:var(--card);border:1px solid rgba(230,215,189,.7);border-radius:8px;box-shadow:0 1px 2px rgba(20,70,70,.08),0 8px 22px rgba(20,70,70,.13);padding:14px 16px;text-align:center}
.gz-top{display:flex;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:6px}
.gz-name{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.01em;margin:8px 0 2px;font-style:italic}
.gz-rule{border-top:3px double var(--ink);margin:6px 0 10px}
.gz-head{font-size:22px;line-height:1.2;font-weight:500;text-wrap:balance}
.gz-deck{font-size:14px;color:var(--muted);font-style:italic;margin-top:6px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.big{font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:16px;color:var(--muted);font-weight:400}
.bar{height:12px;border-radius:2px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .4s}
.status{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid currentColor;font-style:italic}
.week-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wd .cell{width:100%;max-width:36px;aspect-ratio:1;border:1px dashed #CDB894;border-radius:3px;display:grid;place-items:center;position:relative;overflow:hidden}
.wd .fill{position:absolute;inset:auto 0 0 0}
.mp{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px dashed var(--line);text-align:left;width:100%}
.mp .box{width:30px;height:30px}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally span{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--paper)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:4px 12px 14px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.cday{aspect-ratio:3/4;border:1px solid var(--line);border-radius:3px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;font-size:13px;font-variant-numeric:tabular-nums;position:relative;overflow:hidden}
.cday.future{opacity:.35;cursor:default}
.cday.today{border-color:var(--pink);border-width:2px}
.cday .pm{position:absolute;inset:auto 0 9px 0;display:flex;justify-content:center;pointer-events:none;opacity:.85}
.cday .dots{display:flex;gap:2px;position:relative}
.cday .dots i{width:5px;height:5px;border-radius:50%}
.cday .frac{position:absolute;left:0;bottom:0;right:0;opacity:.18}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:0 16px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.sc{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-top:1px dashed var(--line);text-align:left;width:100%}
.sc-row{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.sc-row b{font-weight:500}
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--cherry);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;gap:6px;max-width:480px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:6px}
nav.tabs .it{font-family:var(--script);font-size:28px;line-height:.9;line-height:1.1;color:var(--muted)}
nav.tabs .en{font-size:10px;letter-spacing:.14em;color:var(--muted)}
nav.tabs button.on{background:var(--paper)}
nav.tabs button.on .it{color:var(--cherry)}
.note{text-transform:none;width:100%;box-sizing:border-box;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;min-height:76px}
.note:focus{outline:2px solid var(--butter);outline-offset:1px}
.note::placeholder{color:#B39C7E;font-style:italic}
.diary-list{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.diary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:14px}
.diary .caps{width:32px}
.fpill{font-size:12px;border:1px solid;border-radius:999px;padding:1px 8px;font-style:italic}
.dnote{text-transform:none;flex-basis:100%;padding-left:40px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.about p{margin:0;font-size:15px;line-height:1.6;max-width:62ch}
.about .aristotle{font-style:italic;font-size:17px;text-align:center;padding:4px 0}
.about .script-line{font-family:var(--script);font-size:32px;color:var(--pink);text-align:center;line-height:1}
.login{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px}
.login input{text-transform:none;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--cream);color:var(--ink)}
.login input:focus{outline:2px solid var(--pink);outline-offset:1px}
.err{color:#9E2522;font-size:14px}
.signout{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:6px}
.foot{text-align:center;font-size:12px;color:var(--muted);font-style:italic}
.notice{background:var(--paper);border:1px dashed var(--muted);border-radius:6px;padding:10px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="topbar" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<script src="supabase.js"></script>
<script>
(function(){
const APP_START='2026-09-28';
const COLORS={morning:'#E8742C',night:'#3B5B9A',spirit:'#1F8A8A',fitness:'#C8322F',diet:'#D9A520',hobby:'#D9486F'};
const TEXT={morning:'#9A4613',night:'#2C4577',spirit:'#155F5F',fitness:'#9E2522',diet:'#7F5F0D',hobby:'#A5304F'};
const MOTIF={morning:'sun',night:'moon',spirit:'olive',fitness:'star',diet:'lemon',hobby:'heart'};
const MORNING=[['hair','Hair'],['makeup','Makeup'],['prayer','Prayer'],['scripture','Daily scripture'],['guasha','Gua sha'],['gut','clean slate']];
const NIGHT=[['digestivo','Cherry digestivo'],['shower','Shower'],['lotion','Body lotion'],['lash','Lash serum'],['retainers','Retainers']];
const SPIRIT=['Meeting','Family worship','Personal study','Study for the meeting','Meeting','Study the Watchtower','Service'];
const WORKOUTS=[['pilates','Pilates'],['sculpt','Sculpt'],['steps','10k steps']];
const FOOD=[['clean','Fresco','#D9A520','#7F5F0D'],['balanced','Balanced','#E8742C','#9A4613'],['better','Could be better','#8A6A4A','#5E4630']];
const FOOD_BY=Object.fromEntries(FOOD.map(f=>[f[0],f]));
const HOBBY_MAIN=[['journaling','Journaling'],['drumming','Drumming'],['bedazzling','Bedazzling']];
const HOBBY_FUN=[['headstand','Headstand'],['photography','Photography'],['atelier','Studio atelier']];
const HOBBY_NAME=Object.fromEntries([...HOBBY_MAIN,...HOBBY_FUN]);
const DAILY_TOTAL=MORNING.length+NIGHT.length+1;
const QUOTES=['The life of leisure is earned','Slow mornings, strong habits','Dolce far niente, after the checklist','Lock in now, lounge later','Postcards from your best self','Show up like it’s summer on the coast'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const FULLDOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=()=>iso(new Date());
const mondayOf=s=>{const d=parse(s);return add(s,-((d.getDay()+6)%7))};
const longDate=s=>{const d=parse(s);return FULLDOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()};
const nice=s=>{const d=parse(s);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=['zero','one','two','three','four','five','six','seven'];

function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const state={
  days:lsGet('lol.days',{}),weeks:lsGet('lol.weeks',{}),
  tab:lsGet('lol.tab','today'),date:todayIso(),week:mondayOf(todayIso()),
  month:todayIso().slice(0,7),popKey:null,sync:'loading'
};
if(!['today','week','history'].includes(state.tab))state.tab='today';
let db=null;const pendingDays=new Set(),pendingWeeks=new Set(),timers={},chains={};

const C='#FFFBF4';
const MOTIFS={
 heart:'<path d="M28 38C18 31 14 26 14 21.5C14 18 16.5 15.5 19.8 15.5C22.2 15.5 24 17 28 20C32 17 33.8 15.5 36.2 15.5C39.5 15.5 42 18 42 21.5C42 26 38 31 28 38Z" fill="'+C+'"/>',
 sun:'<circle cx="28" cy="27" r="6" fill="'+C+'"/><g stroke="'+C+'" stroke-width="2" stroke-linecap="round"><path d="M28 15v4M28 35v4M16 27h4M36 27h4M19.5 18.5l2.8 2.8M33.7 32.7l2.8 2.8M19.5 35.5l2.8-2.8M33.7 21.3l2.8-2.8"/></g>',
 lemon:'<ellipse cx="27" cy="29" rx="10" ry="7.5" fill="'+C+'" transform="rotate(-20 27 29)"/><path d="M33 20c3-4 7-4 8-3c-1 3-4 5-8 3z" fill="'+C+'"/>',
 olive:'<path d="M18 38C24 30 30 22 38 15" stroke="'+C+'" stroke-width="1.6" fill="none" stroke-linecap="round"/><g fill="'+C+'"><ellipse cx="22" cy="29" rx="4.5" ry="2" transform="rotate(-60 22 29)"/><ellipse cx="29" cy="30" rx="4.5" ry="2" transform="rotate(20 29 30)"/><ellipse cx="28" cy="21" rx="4.5" ry="2" transform="rotate(-60 28 21)"/><ellipse cx="35" cy="22" rx="4.5" ry="2" transform="rotate(20 35 22)"/><circle cx="37" cy="16" r="2.2"/></g>',
 star:'<path d="M28 14l3.6 8.4 9 .8-6.8 6 2 8.8L28 33.4 20.2 38l2-8.8-6.8-6 9-.8z" fill="'+C+'"/>',
 moon:'<path d="M32 15a12 12 0 1 0 8 18a9.5 9.5 0 1 1-8-18z" fill="'+C+'"/>'
};
function stamp(cat,size,seed){
  const r=((seed||0)%7)-3;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 56 56" style="--r:'+r+'deg;transform:rotate('+r+'deg)" aria-hidden="true"><rect x="4" y="4" width="48" height="48" fill="'+COLORS[cat]+'" stroke="'+C+'" stroke-width="5" stroke-dasharray="0 6.85" stroke-linecap="round"/><rect x="10" y="10" width="36" height="36" fill="none" stroke="'+C+'" stroke-width="1"/>'+MOTIFS[MOTIF[cat]]+'</svg>';
}
function postmark(date,size){
  const d=parse(date),t=(MON[d.getMonth()]+' '+d.getDate()).toLowerCase();
  return '<svg width="'+size+'" height="'+(size*0.62)+'" viewBox="0 0 100 62" aria-hidden="true"><circle cx="31" cy="31" r="25" fill="none" stroke="#C8322F" stroke-width="1.8"/><circle cx="31" cy="31" r="20" fill="none" stroke="#C8322F" stroke-width=".9"/><text x="31" y="28" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-size="8.5" letter-spacing="1" fill="#C8322F">posted</text><text x="31" y="39" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-size="8" fill="#C8322F">'+t+'</text><path d="M59 22q5-4 10 0t10 0t10 0t10 0M59 31q5-4 10 0t10 0t10 0t10 0M59 40q5-4 10 0t10 0t10 0t10 0" fill="none" stroke="#C8322F" stroke-width="1.5"/></svg>';
}
function miniPostmark(){return '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#C8322F" stroke-width="1.6"/><circle cx="15" cy="15" r="8.5" fill="none" stroke="#C8322F" stroke-width=".8"/></svg>'}

const day=d=>state.days[d]||{};
const hobbiesOf=x=>Array.isArray(x.hobbies)?x.hobbies:(x.hobby?[x.hobby]:[]);
const dayChecks=d=>day(d).checks||{};
function dayCount(d){const c=dayChecks(d);return MORNING.filter(h=>c[h[0]]).length+NIGHT.filter(h=>c[h[0]]).length+(c.spirit?1:0)}
const posted=d=>dayCount(d)===DAILY_TOTAL;
function seedOf(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)}

function quarterInfo(s){
  const mon=mondayOf(s),d=parse(mon),q=Math.floor(d.getMonth()/3)+1,qs=iso(new Date(d.getFullYear(),(q-1)*3,1)),qe=iso(new Date(d.getFullYear(),q*3,0));
  let firstMon=mondayOf(qs);if(firstMon<qs)firstMon=add(firstMon,7);
  const wks=(a,b)=>Math.round((parse(b)-parse(a))/864e5/7);
  return{q,year:d.getFullYear(),wk:wks(firstMon,mon)+1,total:Math.floor((parse(qe)-parse(firstMon))/864e5/7)+1};
}

function weekStats(mon){
  const days=[...Array(7)].map((_,i)=>add(mon,i)),t=todayIso();
  const counted=days.filter(d=>d<=t);
  let fit=0,fitS=0,fitM=0,stepsN=0,diet=0,bal=0,bet=0,spirit=0,hobby=0,mor=0,nig=0;const hob={};
  days.forEach(d=>{const x=day(d),c=x.checks||{};
    const wo=x.workouts||[],cls=wo.filter(w=>w!=='steps');cls.forEach(w=>{fit++;w==='sculpt'?fitM++:fitS++});if(wo.includes('steps')){stepsN++;if(!cls.length)fit++}
    if(x.food==='clean')diet++;else if(x.food==='balanced')bal++;else if(x.food==='better')bet++;if(c.spirit)spirit++;
    {const hs=hobbiesOf(x);if(hs.length){hobby++;hs.forEach(k=>{hob[k]=(hob[k]||0)+1})}}
    mor+=MORNING.filter(h=>c[h[0]]).length;nig+=NIGHT.filter(h=>c[h[0]]).length;
  });
  const targets={fitness:5,diet:5,hobby:5,spirit:7};
  const n=Math.max(counted.length,1);
  return{days,counted,targets,fit,fitS,fitM,stepsN,diet,bal,bet,spirit,hobby,hob,

  let body=state.tab==='week'?renderWeek():state.tab==='history'?renderHistory():renderToday();
  app.innerHTML=header()+body+'<div class="foot"><span id="sync">'+syncText()+'</span>'+(user?'<br><button class="signout" data-act="signout">sign out</button>':'')+'</div>';
  document.getElementById('tabs').innerHTML=[['today','Oggi','Today'],['week','Settimana','This week'],['history','Archivio','History']].map(t=>'<button class="'+(state.tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'" aria-current="'+(state.tab===t[0]?'page':'false')+'"><span class="it">'+t[1]+'</span><span class="en">'+t[2]+'</span></button>').join('');
  state.popKey=null;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,d=state.date;
  if(a==='habit'){const k=b.dataset.k;setDay(d,x=>{x.checks[k]=!x.checks[k];if(!x.checks[k])delete x.checks[k];else state.popKey=k})}
  else if(a==='workout'){const k=b.dataset.k;setDay(d,x=>{const w=new Set(x.workouts||[]);w.has(k)?w.delete(k):w.add(k);x.workouts=[...w]})}
  else if(a==='food'){const k=b.dataset.k;setDay(d,x=>{x.food=x.food===k?null:k})}
  else if(a==='hobby'){const k=b.dataset.k;setDay(d,x=>{const h=new Set(hobbiesOf(x));h.has(k)?h.delete(k):h.add(k);x.hobbies=[...h];delete x.hobby})}
  else if(a==='mealprep'){const w=state.week,x=clone(state.weeks[w]);x.mealPrep=!x.mealPrep;state.weeks[w]=x;lsSet('lol.weeks',state.weeks);queueSave('weeks',w,x,pendingWeeks)}
  else if(a==='tab'){state.tab=b.dataset.t;lsSet('lol.tab',state.tab);if(state.tab==='today')state.date=todayIso();if(state.tab==='week')state.week=mondayOf(todayIso());window.scrollTo(0,0)}
  else if(a==='day'){const v=b.dataset.d;state.date=v==='today'?todayIso():add(state.date,+v);if(state.date>todayIso())state.date=todayIso()}
  else if(a==='week'){state.week=add(state.week,+b.dataset.d)}
  else if(a==='month'){const[y,m]=state.month.split('-').map(Number),n=new Date(y,m-1+(+b.dataset.d),1);state.month=n.getFullYear()+'-'+pad(n.getMonth()+1)}
  else if(a==='open'){state.date=b.dataset.date;state.tab='today';window.scrollTo(0,0)}
  else if(a==='signout'){if(sb)sb.auth.signOut();user=null;state.days={};state.weeks={};lsSet('lol.days',{});lsSet('lol.weeks',{});}
  else if(a==='openweek'){state.week=b.dataset.w;state.tab='week';window.scrollTo(0,0)}
  else return;
  render();
});

let deferred=false;
function safeRender(){if(document.activeElement&&document.activeElement.id==='food-note'){deferred=true;return}render()}
document.addEventListener('input',e=>{if(e.target.id==='food-note'){const v=e.target.value;setDay(state.date,x=>{x.foodNote=v})}});
document.addEventListener('focusout',e=>{if(e.target.id==='food-note'&&deferred){deferred=false;setTimeout(render,0)}});
let lastDay=todayIso();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(todayIso()!==lastDay){if(state.date===lastDay)state.date=todayIso();lastDay=todayIso();render()}checkForUpdate();if(user)sync()});
window.addEventListener('online',()=>{if(user)sync()});

render();

document.addEventListener('submit',async e=>{
  if(e.target.id!=='login')return;e.preventDefault();
  const email=document.getElementById('login-email').value.trim(),pw=document.getElementById('login-pw').value;
  const btn=e.target.querySelector('button');btn.textContent='signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){loginErr='that email or password didn’t work. try again.';render();return}
  loginErr='';user=data.user;state.sync='loading';render();sync();
});
(async()=>{
  if(!window.supabase){state.sync='error';render();return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'lol.auth'}});
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;authChecked=true;
  if(user){state.sync=navigator.onLine?'loading':'offline';render();sync()}else render();
  sb.auth.onAuthStateChange((ev,session)=>{user=session?session.user:null});
})();
})();
</script>
</body>
</html>

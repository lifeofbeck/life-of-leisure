<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#F7F3EC;--ink:#2B2622;--muted:#8C8178;--soft:#B5ABA0;--line:#E4DCD0;--wash:#EFE8DD;--accent:#9E3B32;
  --serif:'Cormorant Garamond','Iowan Old Style',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.35;padding-inline:22px;padding-block:calc(env(safe-area-inset-top,0px) + 22px) calc(96px + env(safe-area-inset-bottom,0px));text-transform:lowercase;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;pointer-events:none;background:var(--ink);height:env(safe-area-inset-top,0px)}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
button{font:inherit;color:inherit;text-transform:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.caps{font-size:10.5px;letter-spacing:.24em;color:var(--muted);font-weight:500;text-transform:uppercase}
header.top{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--ink);color:var(--bg);padding:34px 16px 24px;margin:-22px -22px 0}
header.top .caps{color:#C9BFB3}
header.top .tagline{color:#E3A79F}
.wordmark{font-size:30px;font-style:italic;font-weight:500;letter-spacing:.01em;line-height:1.1;margin-top:2px}
.tagline{color:var(--accent)}
.qline{color:var(--muted);margin-top:6px}
.sec{display:flex;flex-direction:column}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:3px double var(--ink)}
.sec-h .caps{color:var(--ink)}
.sec-t{font-size:23px;font-style:italic;font-weight:500;line-height:1;color:var(--accent)}
.sec-s{margin-top:5px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.greet{font-size:21px;font-style:italic;font-weight:500;text-align:center}
.navbtn{width:34px;height:34px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.navbtn[disabled]{opacity:.25;cursor:default}
.today-link{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;margin-top:2px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;min-height:48px}
.mark{width:18px;height:18px;flex-shrink:0;border-radius:50%;border:1px solid var(--soft);display:grid;place-items:center;transition:background .2s,border-color .2s}
.row.on .mark,.mark.on{background:var(--accent);border-color:var(--accent)}
.mark svg{opacity:0}.row.on .mark svg,.mark.on svg{opacity:1}
.lbl{font-size:18px;font-weight:500}
.row.on .lbl{color:var(--muted)}
.sub{font-size:14px;color:var(--muted);font-style:italic}
.group{padding:14px 0 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.group-h .lbl{font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--soft);font-size:16px;min-height:34px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fun-lbl{font-size:13px;color:var(--muted);font-style:italic}
.key{display:flex;flex-direction:column;gap:1px;line-height:1.4}
.key b{font-weight:500;font-style:normal;color:var(--ink)}
.note{text-transform:none;width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--soft);padding:6px 0 8px;resize:vertical;min-height:70px;border-radius:0}
.note:focus{outline:none;border-bottom-color:var(--accent)}
.note::placeholder{color:var(--soft);font-style:italic}
.ai{display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:var(--ink);color:var(--bg);border-radius:3px}
.ai.empty{align-items:center}
.ai.empty .ai-w{font-style:italic;color:#C9BFB3;font-size:15px}
.ai-r{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#E3A79F}
.ai-w{font-size:16px;line-height:1.45}
.quote{text-align:center;font-style:italic;font-size:16px;color:var(--muted)}
.postmark{display:flex;justify-content:center;margin-top:-10px}
.foot{text-align:center;font-size:13px;color:var(--muted);font-style:italic}
.signout{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:4px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gazette{text-align:center;padding:16px 0 18px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.gz-top{display:flex;justify-content:space-between}
.gz-name{font-size:28px;font-style:italic;font-weight:500;margin:10px 0 0}
.gz-head{font-size:21px;line-height:1.25;text-wrap:balance}
.gz-deck{font-size:15px;color:var(--muted);font-style:italic;margin-top:6px}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:12px}
.big{font-size:36px;font-weight:500;font-variant-numeric:lining-nums tabular-nums;line-height:1}
.big small{font-size:16px;color:var(--muted);font-weight:400;font-style:italic}
.status{font-size:13px;font-style:italic;color:var(--accent)}
.bar{height:2px;background:var(--line);margin:10px 0 2px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .4s}
.tally{font-size:15px;color:var(--muted);font-style:italic}
.wk-sum{font-size:18px;font-style:italic;color:var(--ink);text-align:center;padding:4px 0 2px}
.wk-sum b{font-weight:600}
.wk-d{font-size:15px;color:var(--ink);font-style:italic;padding-top:10px}
.wgrid{display:grid;grid-template-columns:minmax(84px,1fr) repeat(7,26px) 44px;align-items:center;row-gap:12px;column-gap:4px;padding-top:14px}
.wg-d{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.1em}
.wg-d.now{color:var(--accent)}
.wg-l{font-size:15px}
.wg-c{display:grid;place-items:center}
.wg-n{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.wg-n.met{color:var(--accent)}
.wg-sep{grid-column:1/-1;height:1px;background:var(--line)}
.dot.fut{opacity:.35}
.wg-det{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tiles{display:flex;flex-direction:column;gap:12px}
.tile-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tile-n{font-size:30px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.tile-n small{font-size:15px;color:var(--muted)}
.tile.met .tile-n{color:var(--accent)}
.tile-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.tile-bar i{display:block;height:100%;background:var(--accent)}
.tile-d{font-size:14px;color:var(--muted)}
.rt{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.rt-l{width:70px;font-size:15px}
.rt-dots{flex:1;display:flex;justify-content:space-between}
.rt-n{width:40px;text-align:right;font-size:14px}
.tally4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.t4-n{font-size:26px;line-height:1.1}
.t4-n small{font-size:13px;color:var(--muted)}
.t4.met .t4-n{color:var(--accent)}
.t4 .caps{font-size:9px;letter-spacing:.14em}
.dayrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.dr-d{display:flex;flex-direction:column;align-items:center;width:38px}
.dr-n{font-size:20px;line-height:1}
.dr-tags{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--wash);color:var(--ink)}
.dr-p{font-size:13px;color:var(--muted)}
html.boho .tile-bar i{background:var(--turq)}
html.boho .tile.met .tile-n,html.boho .t4.met .t4-n,html.boho .wg-n.met{color:var(--turq)}
html.boho .wg-d.now{color:var(--turq)}
html.boho .tile-n,html.boho .t4-n,html.boho .dr-n{font-family:var(--serif)}
.week-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;letter-spacing:.12em;color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--muted);position:relative;overflow:hidden}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot .half{position:absolute;left:0;right:0;bottom:0;background:var(--soft)}
.mp{display:flex;align-items:center;gap:12px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line);text-align:left;width:100%}
.diary-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.diary{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:15px}
.diary .caps{width:34px}
.fpill{font-style:italic;color:var(--ink)}
.dnote{text-transform:none;flex-basis:100%;padding-left:44px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.ai-mini{font-style:italic;color:var(--accent)}
.wt{font-size:28px;font-weight:500;min-height:0;width:140px;resize:none;padding:2px 0 6px}
.wchart{width:100%;height:auto;margin-top:12px;overflow:visible}
.wchart .gl{stroke:var(--line);stroke-width:1}
.wchart .gt{font-size:11px;fill:var(--muted);font-family:var(--serif)}
.wchart .wl{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.wchart .wp{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.wrow{display:flex;align-items:baseline;gap:12px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 4px;margin-top:12px}
.cal .dow{text-align:center;font-size:10.5px;letter-spacing:.2em;color:var(--muted);padding-bottom:6px}
.cday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:16px;font-variant-numeric:lining-nums tabular-nums;position:relative}
.cday .n{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.cday.posted .n{border:1px solid var(--accent);color:var(--accent)}
.cday.today .n{background:var(--ink);color:var(--bg)}
.cday.future{color:var(--soft);cursor:default}
.cday .pip{width:4px;height:4px;border-radius:50%;background:var(--soft)}
.cday .pip.hide{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted);font-style:italic}
.fbar{display:flex;height:3px;margin:12px 0 6px;gap:2px}
.fbar i{display:block;height:100%}
.sc{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.sc-row{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.about-box{background:var(--ink);color:var(--bg);padding:24px 20px 22px;border-radius:3px;margin-top:6px}
.about-box .sec-t{color:#E3A79F}
.about-box .caps{color:#C9BFB3}
.about-box p{margin:14px 0 0;font-size:17px;line-height:1.55}
.about-box .aristotle{font-style:italic;font-size:19px;text-align:center;margin-top:18px}
.about-box .who{font-size:14px;color:#C9BFB3}
.about-box .end{font-style:italic;text-align:center;color:#E3A79F;margin-top:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;max-width:460px;width:100%;justify-content:space-around}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;flex:1;min-width:0}
nav.tabs .it{font-size:18px;padding:6px 0;white-space:nowrap;font-style:italic;color:var(--muted);line-height:1.1}
nav.tabs .en{font-size:8.5px;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase;color:var(--soft)}
nav.tabs button.on .it{color:var(--accent)}
nav.tabs button.on .en{color:var(--accent)}
.login{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.login input{text-transform:none;font:inherit;font-size:17px;padding:8px 0;border:0;border-bottom:1px solid var(--soft);background:transparent;color:var(--ink);border-radius:0}
.login input:focus{outline:none;border-bottom-color:var(--accent)}
.err{color:var(--accent);font-size:15px}

/* ---------- free spirit boho ---------- */
html.boho{--bg:#FAF7F2;--ink:#3A2C24;--muted:#8F7D70;--soft:#D3C6B8;--line:#EAE2D8;--wash:#F2ECE4;--accent:#A8684A;--turq:#3E9E96;--turq-l:#B9E0DA;--leather:#3F2A1F;--tan:#C9A27E;
  --serif:'Bodoni Moda','Didot',Georgia,serif;--sans:'Jost','Avenir Next','Helvetica Neue',sans-serif}
html.boho{background:var(--leather);color-scheme:dark}
html.boho body,html.boho input,html.boho textarea{color-scheme:light}
html.boho body{font-family:var(--sans);font-size:17px;line-height:1.5;font-weight:400;min-height:100vh;min-height:100dvh}
html.boho,html.boho body{overscroll-behavior-y:none}
html.boho .topbar{background:var(--leather)}
html.boho header.top{background:var(--leather);color:#F7EFE6;padding:26px 16px 22px;border-bottom:3px solid var(--turq)}
html.boho header.top .caps{color:#CDB8A6}
html.boho header.top .tagline{color:var(--turq-l)}
html.boho .wordmark{font-family:var(--serif);font-style:normal;font-weight:400;font-size:31px;letter-spacing:.04em}
html.boho .caps{font-family:var(--sans);letter-spacing:.22em;font-weight:400}
html.boho .sec-t{font-family:var(--serif);font-style:normal;font-weight:400;font-size:23px;color:var(--leather);letter-spacing:.01em}
html.boho .sec-h{border-bottom:1px solid var(--soft);padding-bottom:10px}
html.boho .sec-h .caps{color:var(--ink)}
html.boho .sec-h button.caps{color:var(--turq)!important}
html.boho .daybar{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
html.boho .greet{font-family:var(--serif);font-style:normal;font-weight:400;font-size:21px;color:var(--leather)}
html.boho .today-link{color:var(--turq)}
html.boho .mark{width:20px;height:20px;border:1px solid var(--soft)}
html.boho .row.on .mark,html.boho .mark.on{background:var(--turq);border-color:var(--turq)}
html.boho .lbl{font-weight:400;font-size:16px}
html.boho .row{min-height:44px;padding:10px 0}
html.boho .mark{width:18px;height:18px}
html.boho .group-h .lbl{font-family:var(--serif);font-style:normal;font-size:18px;color:var(--leather)}
html.boho .sub,html.boho .tally,html.boho .wk-d,html.boho .legend,html.boho .foot,html.boho .quote,html.boho .wk-sum{font-style:normal}
html.boho .chip{border:1px solid var(--soft);background:transparent;font-size:15px}
html.boho .chip.on{background:var(--turq);border-color:var(--turq);color:#fff}
html.boho .ai,html.boho .about-box{background:var(--leather);border-radius:16px}
html.boho .ai-r,html.boho .about-box .sec-t,html.boho .about-box .end{color:var(--turq-l)}
html.boho .ai.empty .ai-w,html.boho .about-box .caps,html.boho .about-box .who{color:#CDB8A6}
html.boho .note:focus{border-bottom-color:var(--turq)}
html.boho .dot{border:1px solid var(--soft)}
html.boho .dot.on{background:var(--turq);border-color:var(--turq)}
html.boho .dot .half{background:var(--tan)}
html.boho .wd{color:var(--muted)}
html.boho .cday.today .n{background:var(--leather);color:#fff}
html.boho .cday.posted .n{border:1px solid var(--turq);color:var(--turq)}
html.boho .wchart .wl{stroke:var(--leather);stroke-width:1.5}
html.boho .wchart .wp{fill:var(--turq)}
html.boho nav.tabs{background:var(--bg);border-top:1px solid var(--line)}
html.boho .wk-sum b{font-weight:500;color:var(--turq)}
html.boho .sc .lbl{font-family:var(--serif);font-style:normal!important}
html.boho nav.tabs .it{font-family:var(--sans);font-style:normal;font-size:14px;letter-spacing:.12em;text-transform:lowercase}
html.boho nav.tabs button.on .it{color:var(--leather);border-bottom:1.5px solid var(--turq);padding-bottom:4px}
.cday.some .n{color:var(--accent)}
.cday.posted .n{border:0!important;color:var(--accent)!important;font-weight:700}
.cday.today .n{color:var(--bg)!important}
.lg-all{font-weight:700;color:var(--accent)}
.lg-some{color:var(--accent)}
html.boho .cday.some .n,html.boho .cday.posted .n,html.boho .lg-all,html.boho .lg-some{color:var(--turq)!important}
html.boho .cday.today .n{color:#fff!important}
html.boho .dot .half{background:var(--turq)!important}
.qbox{text-align:center}
.qbox .aristotle{margin-top:12px}
html.boho #weight.wt{border:1px solid var(--soft);border-radius:999px;padding:6px 14px;font-size:15px;line-height:20px;width:96px;height:34px;min-height:34px;text-align:center;font-family:var(--sans);font-weight:400;resize:none}
html.boho #weight.wt:focus{border-color:var(--turq)}
html.boho #weight.wt::placeholder{font-style:normal;color:var(--muted)}
.menubtn{position:absolute;top:14px;right:12px;width:40px;height:40px;display:grid;place-items:center;color:inherit;opacity:.85}
header.top{position:relative}
.setbar{display:flex;align-items:center;justify-content:space-between}
.mini{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.addrow{display:flex;gap:10px;align-items:center;padding-top:12px}
.pill-in{flex:1;min-width:0;font:inherit;font-size:15px;text-transform:none;height:34px;padding:0 14px;border:1px solid var(--soft);border-radius:999px;background:transparent;color:var(--ink)}
.pill-in:focus{outline:none;border-color:var(--accent)}
html.boho .pill-in:focus{border-color:var(--turq)}
.arch{padding-top:14px}
.chip.danger{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.del-on{color:#fff!important;background:var(--accent);border-radius:999px;padding:3px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  const t=todayIso(),cd=state.clearDate||t,cs=state.clearState,rs=state.resetState;
  let h='<div class="setbar"><button class="today-link" data-act="closeset">‹ back</button><div class="sec-t">settings</div><span style="width:44px"></span></div>';
  h+=manageList('morning','morning habits')+manageList('night','night habits')+manageList('hobbies','hobbies');
  h+='<section class="sec"><div class="sec-h"><div><div class="sec-t">clear a day</div><div class="caps sec-s">weigh-ins and cycle always stay</div></div></div><div class="group"><div class="addrow"><input type="date" id="clear-date" class="pill-in" max="'+t+'" value="'+cd+'" aria-label="day to clear"><button class="chip'+(cs==='confirm'?' on danger':'')+'" data-act="clearday">'+(cs==='confirm'?'tap again to clear':'clear')+'</button></div>'+(cs==='done'?'<div class="sub">'+nice(state.clearedDate).toLowerCase()+' is cleared.</div>':'')+'</div></section>';
  h+='<section class="sec"><div class="sec-h"><div><div class="sec-t">start over</div><div class="caps sec-s">clears every day and week · weigh-ins stay</div></div></div><div class="group"><div><button class="chip'+(rs==='confirm'?' on danger':'')+'" data-act="resetall">'+(rs==='confirm'?'tap again to start over':rs==='working'?'clearing…':'start over')+'</button></div>'+(rs==='done'?'<div class="sub">a clean page. starting today.</div>':rs==='error'?'<div class="sub">that didn’t go through. check your connection and try again.</div>':'')+'</div></section>';
  h+='<section class="sec"><div class="sec-h"><div class="sec-t">account</div></div><div class="group"><div><button class="chip" data-act="signout">sign out</button></div></div></section>';
  return h;
}
function keepOnly(d){const x=state.days[d]||{},k={date:d};if(x.weight!=null)k.weight=x.weight;if(x.cycle)k.cycle=x.cycle;return k}
function clearDay(d){clearTimeout(timers['days'+d]);state.days[d]=keepOnly(d);lsSet('lol.days',state.days);queueSave('days',d,state.days[d],pendingDays)}
async function startOver(){
  state.resetState='working';render();
  Object.keys(state.days).forEach(d=>{clearTimeout(timers['days'+d]);state.days[d]=keepOnly(d);dirty.days[d]=1});
  lsSet('lol.days',state.days);lsSet('lol.dirty',dirty);
  Object.keys(state.weeks).forEach(k=>{delete dirty.weeks[k]});state.weeks={};lsSet('lol.weeks',{});
  const c=cfg();c.start=todayIso();state.cfg=c;saveCfg();
  try{if(sb&&user){const r=await sb.from('weeks').delete().eq('user_id',user.id);if(r.error)throw r.error}flushAll();state.resetState='done'}catch(e){console.warn(e);state.resetState='error'}
  render();
}
function startDate(){const c=cfg();return c.start&&c.start>APP_START?c.start:APP_START}

function renderLogin(){
  return '<header class="top" style="padding-top:40px"><div class="wordmark">keep your promises</div><div class="caps tagline">the life of leisure is earned</div></header><form class="login" id="login"><div class="sec-t">welcome</div><label for="login-email" class="caps">email</label><input id="login-email" type="email" autocomplete="username" required><label for="login-pw" class="caps">password</label><input id="login-pw" type="password" autocomplete="current-password" required>'+(loginErr?'<div class="err">'+esc(loginErr)+'</div>':'')+'<button type="submit" class="chip on" style="align-self:flex-start;margin-top:8px">sign in</button><div class="sub">you only have to do this once on this phone.</div></form>';
}
function render(){
  const app=document.getElementById('app'),tabsEl=document.querySelector('nav.tabs');
  if(authChecked&&!user){tabsEl.hidden=true;app.innerHTML=renderLogin();return}
  tabsEl.hidden=false;
  const body=state.tab==='settings'?renderSettings():state.tab==='week'?renderWeek():state.tab==='history'?renderHistory():state.tab==='food'?renderFood():state.tab==='body'?renderBody():renderToday();
  app.innerHTML=header()+body+'<div class="foot"><span id="sync">'+syncText()+'</span></div>';
  document.getElementById('tabs').innerHTML=[['today','today'],['food','food'],['body','body'],['week','week'],['history','history']].map(t=>'<button class="'+(state.tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'" aria-current="'+(state.tab===t[0]?'page':'false')+'"><span class="it">'+t[1]+'</span></button>').join('');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,d=state.date;
  if(a==='habit'){const k=b.dataset.k;setDay(d,x=>{x.checks[k]=!x.checks[k];if(!x.checks[k])delete x.checks[k];else state.popKey=k})}
  else if(a==='workout'){const k=b.dataset.k;setDay(d,x=>{const w=new Set(x.workouts||[]);w.has(k)?w.delete(k):w.add(k);x.workouts=[...w]})}
  else if(a==='cycle'){const k=b.dataset.k;setDay(d,x=>{if(x.cycle===k)delete x.cycle;else x.cycle=k})}
  else if(a==='fresh'){if(state.fresh==='confirm'){startFresh();return}state.fresh='confirm'}
  else if(a==='food'){const k=b.dataset.k;setDay(d,x=>{x.food=x.food===k?null:k})}
  else if(a==='hobby'){const k=b.dataset.k;setDay(d,x=>{const h=new Set(hobbiesOf(x));h.has(k)?h.delete(k):h.add(k);x.hobbies=[...h];delete x.hobby})}
  else if(a==='mealprep'){const w=state.week,x=clone(state.weeks[w]);x.mealPrep=!x.mealPrep;state.weeks[w]=x;lsSet('lol.weeks',state.weeks);queueSave('weeks',w,x,pendingWeeks)}
  else if(a==='tab'){state.tab=b.dataset.t;lsSet('lol.tab',state.tab);if(['today','food','body'].includes(state.tab))state.date=todayIso();if(state.tab==='week')state.week=mondayOf(todayIso());window.scrollTo(0,0)}
  else if(a==='day'){const v=b.dataset.d;state.date=v==='today'?todayIso():add(state.date,+v);if(state.date>todayIso())state.date=todayIso()}
  else if(a==='week'){state.week=add(state.week,+b.dataset.d)}
  else if(a==='month'){const key=b.dataset.k||'month',[y,m]=state[key].split('-').map(Number),n=new Date(y,m-1+(+b.dataset.d),1);state[key]=n.getFullYear()+'-'+pad(n.getMonth()+1)}
  else if(a==='open'){state.date=b.dataset.date;state.tab=b.dataset.to||'today';window.scrollTo(0,0)}
  else if(a==='signout'){if(sb)sb.auth.signOut();user=null;state.tab='today';state.days={};state.weeks={};lsSet('lol.days',{});lsSet('lol.weeks',{});}
  else if(a==='settings'){state.delKey=null;state.prevTab=state.tab==='settings'?state.prevTab:state.tab;state.tab='settings';state.clearState=null;state.resetState=null;window.scrollTo(0,0)}
  else if(a==='closeset'){state.tab=state.prevTab||'today';window.scrollTo(0,0)}
  else if(a==='delhabit'){const k=b.dataset.k,sec=b.dataset.sec;if(state.delKey!==k){state.delKey=k}else{const c=cfg();const ci=c.custom[sec].findIndex(x=>x.k===k);if(ci>=0){c.custom[sec].splice(ci,1);c.hidden=c.hidden.filter(x=>x!==k)}else{c.deleted=c.deleted||[];if(!c.deleted.includes(k))c.deleted.push(k)}state.delKey=null;state.cfg=c;saveCfg()}}
  else if(a==='archive'){const c=cfg(),k=b.dataset.k;if(!c.hidden.includes(k))c.hidden.push(k);state.cfg=c;saveCfg()}
  else if(a==='clearday'){const el=document.getElementById('clear-date'),v=el&&el.value;if(!v||v>todayIso())return;state.clearDate=v;if(state.clearState==='confirm'){clearDay(v);state.clearedDate=v;state.clearState='done'}else state.clearState='confirm'}
  else if(a==='resetall'){if(state.resetState==='working')return;if(state.resetState==='confirm'){startOver();return}state.resetState='confirm'}
  else if(a==='restore'){const c=cfg();c.hidden=c.hidden.filter(k=>k!==b.dataset.k);state.cfg=c;saveCfg()}
  else if(a==='openweek'){state.week=b.dataset.w;state.tab='week';window.scrollTo(0,0)}
  else return;
  render();
});

let deferred=false;
function safeRender(){const ae=document.activeElement;if(ae&&(ae.id==='food-note'||ae.id==='weight')){deferred=true;return}render()}
document.addEventListener('input',e=>{if(e.target.id==='clear-date'){state.clearDate=e.target.value;if(state.clearState){state.clearState=null;render()}return}if(e.target.id==='weight'){const v=e.target.value.replace(/[^0-9.]/g,'');const n=parseFloat(v);setDay(state.date,x=>{if(v&&!isNaN(n))x.weight=Math.round(n*10)/10;else delete x.weight});return}if(e.target.id==='food-note'){const v=e.target.value;setDay(state.date,x=>{x.foodNote=v})}});
document.addEventListener('focusout',e=>{if((e.target.id==='food-note'||e.target.id==='weight')&&deferred){deferred=false;setTimeout(render,0)}});
let lastDay=todayIso();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(todayIso()!==lastDay){if(state.date===lastDay)state.date=todayIso();lastDay=todayIso();render()}checkForUpdate();if(user)sync()});
window.addEventListener('online',()=>{if(user)sync()});

render();

document.addEventListener('submit',async e=>{
  if(e.target.id&&e.target.id.startsWith('add-')){e.preventDefault();const sec=e.target.dataset.sec,inp=e.target.querySelector('input'),v=inp.value.trim().toLowerCase();if(!v)return;const c=cfg();c.custom[sec].push({k:'c_'+Date.now().toString(36),label:v});state.cfg=c;saveCfg();render();setTimeout(()=>{const i=document.getElementById('new-'+sec);if(i)i.focus()},0);return}
  if(e.target.id!=='login')return;e.preventDefault();
  const email=document.getElementById('login-email').value.trim(),pw=document.getElementById('login-pw').value;
  const btn=e.target.querySelector('button');btn.textContent='signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){loginErr='that email or password didn’t work. try again.';render();return}
  loginErr='';user=data.user;state.sync='loading';render();sync();
});
(async()=>{
  if(!window.supabase){state.sync='error';render();return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'lol.auth'}});
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;authChecked=true;
  if(user){state.sync=navigator.onLine?'loading':'offline';render();sync()}else render();
  sb.auth.onAuthStateChange((ev,session)=>{user=session?session.user:null});
})();
})();
</script>
</body>
